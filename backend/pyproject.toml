[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy's async engine bridges to sync DB-API calls via greenlet
# switches internally; without this, coverage.py's tracer doesn't follow
# execution across those switches and silently under-reports everything
# that runs immediately after an `await db.execute(...)`-style call.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Autogenerated by `alembic revision --autogenerate`, not hand-formatted --
# every future migration would need a manual black/ruff pass to stay clean
# otherwise, and env.py's model import is deliberately placed where
# Alembic's own template puts it.
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # Depends()/Query() in argument defaults is FastAPI's own dependency
    # injection idiom, used throughout this codebase intentionally --
    # not the mutable-default-argument bug this rule exists to catch.
    "B008",
    # str+Enum (not enum.StrEnum) is deliberate -- see app/models/user.py.
    # Not worth the churn to switch given how many places compare/serialize
    # UserRole values.
    "UP042",
]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "alembic"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
