name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: ruff
        run: ruff check .

      - name: black
        run: black --check .

      - name: mypy
        # Known pre-existing type errors in app/crud and app/api/v1/endpoints
        # (ORM model vs. Pydantic response_model mismatches mypy can't see
        # through) predate this workflow -- see docs/AUDIT.md. Non-blocking
        # until those are cleaned up, so it still reports regressions without
        # leaving CI red on day one for debt this step didn't introduce.
        run: mypy app
        continue-on-error: true

      - name: pytest
        run: pytest -q --cov=app --cov-report=term-missing

  docker:
    # GitHub-hosted runners have Docker + Compose v2 preinstalled, which is
    # more than the local dev sandbox this project was built in ever had --
    # this is the first real build-and-boot of the Dockerfile/compose stack,
    # done continuously on every push instead of once by hand.
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Build the image and start postgres -> migrate -> api
        run: docker compose up --build -d

      - name: Wait for the api service to report healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q api)" 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          echo "api never reported healthy" >&2
          exit 1

      - name: Smoke test /health over real HTTP
        run: curl -sf http://localhost:8000/health

      - name: Show container logs
        if: always()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
