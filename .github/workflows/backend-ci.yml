name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

# A force-push to a PR branch makes the in-flight run obsolete -- cancel it
# rather than paying for both. Pushes to main are never cancelled: that run
# is the record of whether a given main commit was green.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: ruff
        run: ruff check .

      - name: black
        run: black --check .

      - name: mypy
        run: mypy app

      - name: pytest
        # --cov-fail-under sits ~2 points under measured coverage (98% at
        # the time of writing) so it catches a real regression without
        # tripping on rounding.
        run: >-
          pytest -q --cov=app --cov-report=term-missing
          --cov-report=xml --cov-fail-under=95

      - name: Upload coverage report
        # always(), not on success: the coverage report is most useful
        # precisely when --cov-fail-under just failed the step above.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  postgres:
    # The job above is the fast gate and runs on SQLite. This one runs the
    # same suite against the database the app actually ships on, which is
    # the only place the migration chain, `CREATE EXTENSION pg_trgm`, the
    # gin_trgm_ops indexes and asyncpg itself ever execute.
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: authflow
          POSTGRES_PASSWORD: authflow
          POSTGRES_DB: authflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U authflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The service container has no TLS listener, so this exercises the
      # DB_SSL=false path -- the one Alembic used to ignore.
      DB_SSL: "false"
      # The revision a deployment would already be sitting on. Hardcoded
      # because the repo has no release tags yet, so "the previously
      # released revision" has no automatic definition: update this when a
      # migration lands. Tagging releases would let it resolve on its own.
      PREVIOUS_RELEASE_REVISION: "599f1c2ee189"
      # Deliberately no job-level DATABASE_URL: each step below points
      # Alembic at its own database, and conftest refuses to run when
      # TEST_DATABASE_URL and the app's DATABASE_URL are the same.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Create scratch databases for the migration checks
        # Through asyncpg rather than psql: it's already a dependency, so
        # this doesn't depend on which client tools the runner image ships.
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg

          async def main():
              conn = await asyncpg.connect(
                  user="authflow", password="authflow",
                  host="localhost", port=5432, database="authflow",
              )
              for name in ("migrations_fresh", "migrations_upgrade"):
                  await conn.execute(f"DROP DATABASE IF EXISTS {name}")
                  await conn.execute(f"CREATE DATABASE {name}")
              await conn.close()

          asyncio.run(main())
          PY

      - name: Migrations apply to a brand new database
        env:
          DATABASE_URL: postgresql+asyncpg://authflow:authflow@localhost:5432/migrations_fresh
        run: |
          alembic upgrade head
          current=$(alembic current)
          echo "$current"
          echo "$current" | grep -q '(head)'

      - name: Migrations apply on top of the previously deployed revision
        # The real production path: an existing older schema brought
        # forward, not an empty database. Uses a forward upgrade rather than
        # a downgrade so it doesn't depend on the down-migrations being
        # exercised to be meaningful.
        env:
          DATABASE_URL: postgresql+asyncpg://authflow:authflow@localhost:5432/migrations_upgrade
        run: |
          alembic upgrade "$PREVIOUS_RELEASE_REVISION"
          alembic current | grep -q "$PREVIOUS_RELEASE_REVISION"
          alembic upgrade head
          current=$(alembic current)
          echo "$current"
          echo "$current" | grep -q '(head)'

      - name: Backend suite against PostgreSQL 16
        # conftest migrates this database itself, so the suite also proves
        # the schema the migrations produce is the one the app expects.
        # Coverage is gated by the SQLite job; no need to measure it twice.
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://authflow:authflow@localhost:5432/authflow
        run: pytest -q

  docker:
    # GitHub-hosted runners have Docker + Compose v2 preinstalled, which is
    # more than the local dev sandbox this project was built in ever had --
    # this is the first real build-and-boot of the Dockerfile/compose stack,
    # done continuously on every push instead of once by hand.
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Build the image and start postgres -> migrate -> api
        run: docker compose up --build -d

      - name: Wait for the api service to report healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q api)" 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          echo "api never reported healthy" >&2
          exit 1

      - name: Smoke test /health over real HTTP
        run: curl -sf http://localhost:8000/health

      - name: Show container logs
        if: always()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
