services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: authflow
      POSTGRES_PASSWORD: authflow
      POSTGRES_DB: authflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: ./backend
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://authflow:authflow@postgres:5432/authflow
      DB_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://authflow:authflow@postgres:5432/authflow
      DB_SSL: "false"
      SECRET_KEY: local-dev-secret-change-me
      ENVIRONMENT: development
      BACKEND_CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
